# Settings that pnpm 11 no longer reads from package.json's "pnpm" field
# live here. See https://pnpm.io/settings

# Security overrides (CVE pins). pnpm 11 reads `overrides` from this file,
# not from package.json.
overrides:
  qs: ^6.16.0
  vite: 7.3.5
  esbuild: ^0.28.1
  postcss: ^8.5.17
  tmp: ^0.2.7
  # uuid is scoped per-consumer on purpose: @annotorious/* v3 already ships a
  # newer uuid than these advisories need, and a blanket override would drag
  # the annotation editor's runtime back down to 11.x.
  '@recogito/recogito-client-core>uuid': ^11.1.1
  '@lhci/cli>uuid': ^11.1.1

# Build-script approval. pnpm 11 replaced the `onlyBuiltDependencies` list with
# this map and errors (rather than warns) until every package that ships an
# install/build script is explicitly allowed (true) or denied (false).
# All are trusted native/build deps: esbuild, sharp and unrs-resolver need
# their compiled binaries; core-js runs a benign postinstall; @parcel/watcher
# and @swc/core are pulled in by next-intl for file watching and SWC-based
# message extraction.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true
