name: CD

on:
  workflow_run:
    workflows: ['CI Pipeline']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      INFRA_DISPATCH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute release version
        run: echo "APP_VERSION=$(date -u +%Y.%m.%d.%H%M)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push beta image
        id: beta
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://beta.archetype-pal.ink
            NEXT_PUBLIC_IIIF_UPSTREAM=https://beta.archetype-pal.ink
            NEXT_PUBLIC_SITE_URL=https://beta.archetype-pal.ink
            CORS_ALLOWED_ORIGINS=https://beta.archetype-pal.ink
            DOCKER_IMAGE_HASH=${{ github.sha }}
            APP_VERSION=${{ env.APP_VERSION }}
          push: true
          tags: |
            ghcr.io/archetype-pal/frontend:beta
            ghcr.io/archetype-pal/frontend:beta-sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Beta deploys on this event (infrastructure deploy-beta.yml); its cron is only a
      # fallback that GitHub runs hours late. INFRA_DISPATCH_TOKEN is a fine-grained token
      # scoped to the infrastructure repository with contents:write. Skipped when unset.
      - name: Ask the infrastructure repo to deploy beta
        if: env.INFRA_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          gh api repos/archetype-pal/infrastructure/dispatches \
            -f event_type=image-published \
            -f client_payload[image]=frontend \
            -f client_payload[digest]="${{ steps.beta.outputs.digest }}" \
            -f client_payload[commit]="${{ github.sha }}"
      # The three Glasgow images target hosts that are not yet deployed (Track J). Static
      # generation fetches the API at build time and times out when the host is
      # unreachable, so a failure here must not block the beta image above.
      - name: Build and push dev image
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://betaarchetype.gla.ac.uk
            NEXT_PUBLIC_IIIF_UPSTREAM=https://betaarchetype.gla.ac.uk
            NEXT_PUBLIC_SITE_URL=https://betaarchetype.gla.ac.uk
            CORS_ALLOWED_ORIGINS=https://betaarchetype.gla.ac.uk,130.209.34.75
            DOCKER_IMAGE_HASH=${{ github.sha }}
            APP_VERSION=${{ env.APP_VERSION }}
          push: true
          tags: |
            ghcr.io/archetype-pal/frontend:latest
            ghcr.io/archetype-pal/frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push staging-source image
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://archetype.gla.ac.uk
            NEXT_PUBLIC_IIIF_UPSTREAM=https://archetype.gla.ac.uk
            NEXT_PUBLIC_SITE_URL=https://archetype.gla.ac.uk
            CORS_ALLOWED_ORIGINS=https://archetype.gla.ac.uk,130.209.34.75
            DOCKER_IMAGE_HASH=${{ github.sha }}
            APP_VERSION=${{ env.APP_VERSION }}
          push: true
          tags: |
            ghcr.io/archetype-pal/frontend:staging-source
            ghcr.io/archetype-pal/frontend:staging-source-sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push ker image
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://ker.arts.gla.ac.uk
            NEXT_PUBLIC_IIIF_UPSTREAM=https://ker.arts.gla.ac.uk
            NEXT_PUBLIC_SITE_URL=https://ker.arts.gla.ac.uk
            CORS_ALLOWED_ORIGINS=https://ker.arts.gla.ac.uk,130.209.34.75
            DOCKER_IMAGE_HASH=${{ github.sha }}
            APP_VERSION=${{ env.APP_VERSION }}
          push: true
          tags: |
            ghcr.io/archetype-pal/frontend:ker
            ghcr.io/archetype-pal/frontend:ker-sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
