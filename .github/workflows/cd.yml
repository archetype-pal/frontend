name: CD

on:
  workflow_run:
    workflows: ['CI Pipeline']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
      - name: Compute release version
        run: echo "APP_VERSION=$(date -u +%Y.%m.%d.%H%M)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://betaarchetype.gla.ac.uk
            NEXT_PUBLIC_IIIF_UPSTREAM=https://betaarchetype.gla.ac.uk
            NEXT_PUBLIC_SITE_URL=https://betaarchetype.gla.ac.uk
            CORS_ALLOWED_ORIGINS=https://betaarchetype.gla.ac.uk,130.209.34.75
            DOCKER_IMAGE_HASH=${{ github.sha }}
            APP_VERSION=${{ env.APP_VERSION }}
          push: true
          tags: |
            ghcr.io/archetype-pal/frontend:latest
            ghcr.io/archetype-pal/frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push staging-source image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://archetype.gla.ac.uk
            NEXT_PUBLIC_IIIF_UPSTREAM=https://archetype.gla.ac.uk
            NEXT_PUBLIC_SITE_URL=https://archetype.gla.ac.uk
            CORS_ALLOWED_ORIGINS=https://archetype.gla.ac.uk,130.209.34.75
            DOCKER_IMAGE_HASH=${{ github.sha }}
            APP_VERSION=${{ env.APP_VERSION }}
          push: true
          tags: |
            ghcr.io/archetype-pal/frontend:staging-source
            ghcr.io/archetype-pal/frontend:staging-source-sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push ker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://ker.arts.gla.ac.uk
            NEXT_PUBLIC_IIIF_UPSTREAM=https://ker.arts.gla.ac.uk
            NEXT_PUBLIC_SITE_URL=https://ker.arts.gla.ac.uk
            CORS_ALLOWED_ORIGINS=https://ker.arts.gla.ac.uk,130.209.34.75
            DOCKER_IMAGE_HASH=${{ github.sha }}
            APP_VERSION=${{ env.APP_VERSION }}
          push: true
          tags: |
            ghcr.io/archetype-pal/frontend:ker
            ghcr.io/archetype-pal/frontend:ker-sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push elghareeb image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://archetype.elghareeb.space
            NEXT_PUBLIC_IIIF_UPSTREAM=https://archetype.elghareeb.space
            NEXT_PUBLIC_SITE_URL=https://archetype.elghareeb.space
            CORS_ALLOWED_ORIGINS=https://archetype.elghareeb.space
            DOCKER_IMAGE_HASH=${{ github.sha }}
            APP_VERSION=${{ env.APP_VERSION }}
          push: true
          tags: |
            ghcr.io/archetype-pal/frontend:elghareeb
            ghcr.io/archetype-pal/frontend:elghareeb-sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
