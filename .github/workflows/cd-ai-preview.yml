name: CD AI preview

# Only the ai-preview tag. frontend:beta is what beta deploys, so this workflow
# must never publish it. NEXT_PUBLIC_* is inlined at build time, and static
# generation fetches the API, so this fails until the preview's API answers.
on:
  push:
    branches: [feat/annotation-proposal-queue]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compute release version
        run: echo "APP_VERSION=$(date -u +%Y.%m.%d.%H%M)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://ai.archetype-pal.ink
            NEXT_PUBLIC_IIIF_UPSTREAM=https://ai.archetype-pal.ink
            NEXT_PUBLIC_SITE_URL=https://ai.archetype-pal.ink
            CORS_ALLOWED_ORIGINS=https://ai.archetype-pal.ink
            DOCKER_IMAGE_HASH=${{ github.sha }}
            APP_VERSION=${{ env.APP_VERSION }}
          push: true
          tags: |
            ghcr.io/archetype-pal/frontend:ai-preview
            ghcr.io/archetype-pal/frontend:ai-preview-sha-${{ github.sha }}
          cache-from: type=gha,scope=ai-preview
          cache-to: type=gha,scope=ai-preview,mode=max
